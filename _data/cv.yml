        summary: "Network Design — Team Lead; Inventory Optimization — Team Member"
        highlights:
          - "Network design — optimization model: Develop a mixed-integer conic programming model that jointly optimizes facility openings, origin-destination and mode assignments, and MDC-RFC replenishment across cost, working capital, service, and SLA/OTIF objectives."
          - "Network design — data pipeline: Build reproducible Python, SQL, and PySpark pipelines that convert enterprise demand, facility, transportation, and inventory data into validated, versioned model inputs."
          - "Network design — agent architecture: Built the initial DeerFlow-based workflow linking LLM tool orchestration with Databricks compute and optimization jobs, converting natural-language scenarios into traceable solver runs."
          - "Network design — business implementation: Work with business and executive teams to define assumptions and KPIs, communicate model trade-offs, and translate validated scenarios into planning recommendations."
          - "Inventory optimization: Contribute to channel-aware SKU segmentation based on sales volume and demand patterns."
          - "Inventory optimization: Support set segmentation by combining SKU co-sales patterns with business-defined hard-set rules."
          - "Inventory optimization: Contribute to early-stage set-aware safety-stock and multi-echelon inventory optimization modeling."

